<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>{{ disease }} Prediction</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    .form-page {
      min-height: 100vh;
      background-image: url('https://plus.unsplash.com/premium_photo-1661423762612-e8fae810cb4b?ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8MXx8aG9zcGl0YWwlMjBwYXRpZW50c3xlbnwwfHwwfHx8MA%3D%3D&fm=jpg&q=60&w=3000');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      position: relative;
    }
    .form-page::before {
      content: '';
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.4);
    }
    .form-container-modern {
      width: min(700px, 95vw);
      background: rgba(255, 255, 255, 0.02);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 20px;
      padding: 32px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      position: relative;
      z-index: 1;
    }
    .form-header {
      margin-bottom: 24px;
    }
    .form-header h2 {
      font-family: 'Poppins', sans-serif;
      font-size: 32px;
      font-weight: 700;
      color: #ffffff;
      margin: 0 0 8px 0;
      text-shadow: 0 2px 8px rgba(0,0,0,0.3);
    }
    .form-header p {
      font-family: 'Inter', sans-serif;
      font-size: 16px;
      color: #f0f0f0;
      margin: 0;
    }
    .form-container-modern form {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }
    .form-container-modern input {
      padding: 14px 16px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-radius: 12px;
      font-family: 'Inter', sans-serif;
      font-size: 15px;
      transition: all 0.2s;
      background: rgba(255, 255, 255, 0.15);
      color: #ffffff;
    }
    .form-container-modern input::placeholder {
      color: #ffffffcc;
    }
    .form-container-modern input:focus {
      outline: none;
      border-color: #ffffff;
      background: rgba(255, 255, 255, 0.25);
      box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.1);
    }
    .form-buttons-modern {
      grid-column: span 2;
      display: flex;
      justify-content: flex-end;
      gap: 12px;
      margin-top: 8px;
    }
    .reset-btn-modern, .predict-btn-modern {
      padding: 12px 24px;
      border: none;
      border-radius: 12px;
      font-family: 'Inter', sans-serif;
      font-weight: 600;
      font-size: 15px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .reset-btn-modern {
      background: rgba(255, 255, 255, 0.2);
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.3);
    }
    .reset-btn-modern:hover {
      background: rgba(255, 255, 255, 0.3);
    }
    .predict-btn-modern {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #ffffff;
    }
    .predict-btn-modern:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
    }
    .back-btn-modern {
      display: inline-block;
      margin-bottom: 20px;
      color: #ffffff;
      text-decoration: none;
      font-family: 'Inter', sans-serif;
      font-weight: 500;
      font-size: 15px;
      padding: 8px 16px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 8px;
      transition: all 0.2s;
    }
    .back-btn-modern:hover {
      background: rgba(255, 255, 255, 0.3);
    }
  </style>
</head>
<body class="form-page">
  <div class="form-container-modern">
    <a href="{{ url_for('dashboard') }}" class="back-btn-modern">← Back to Dashboard</a>
    <div class="form-header">
      <h2>{{ disease }} Prediction</h2>
      <p>Complete the form below to get your health risk prediction</p>
    </div>
    <form method="POST">
      {% for field in form_fields %}
        {% if field.type == "checkbox" %}
          <div style="grid-column: span 2; display: flex; align-items: center; gap: 8px;">
            <input type="checkbox" name="{{ field.name }}" id="{{ field.name }}" value="1" style="width: 20px; height: 20px; cursor: pointer;">
            <label for="{{ field.name }}" style="color: #ffffff; font-family: 'Inter', sans-serif; font-size: 15px; cursor: pointer;">{{ field.label }}</label>
          </div>
        {% elif field.type == "select" %}
          <div style="grid-column: span 2">
            <label style="color: #ffffff; font-family: 'Inter', sans-serif; font-size: 14px; margin-bottom: 6px; display: block;">{{ field.label }}</label>
            <select name="{{ field.name }}" {% if field.required %}required{% endif %} style="padding: 14px 16px; border: 2px solid rgba(255, 255, 255, 0.3); border-radius: 12px; font-family: 'Inter', sans-serif; font-size: 15px; transition: all 0.2s; background: rgba(255, 255, 255, 0.15); color: #ffffff; width: 100%;">
              {% for value, label in field.options %}
                <option value="{{ value }}" style="color: #1a1a1a;">{{ label }}</option>
              {% endfor %}
            </select>
          </div>
        {% else %}
          <div style="grid-column: span 1">
            <label style="color: #ffffff; font-family: 'Inter', sans-serif; font-size: 14px; margin-bottom: 6px; display: block;">{{ field.label }}</label>
            <input type="{{ field.type }}" name="{{ field.name }}" 
                   placeholder="{{ field.placeholder or field.label }}" 
                   {% if field.required %}required{% endif %}
                   {% if field.step %}step="{{ field.step }}"{% endif %}
                   style="width: 100%;">
          </div>
        {% endif %}
      {% endfor %}
      <div class="form-buttons-modern">
        <button type="reset" class="reset-btn-modern">Reset</button>
        <button type="submit" class="predict-btn-modern">Get Prediction</button>
      </div>
    </form>
  </div>
</body>
</html>
